name: Owtlet CI/CD & Production Build Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Quality, Linting & Type-Checking
  # ----------------------------------------------------------------------------
  code-quality:
    name: Code Quality & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: development/frontend
        run: pnpm install --frozen-lockfile

      - name: Generate Frontend Prisma Client
        working-directory: development/frontend
        run: npx prisma generate

      - name: Typecheck Frontend
        working-directory: development/frontend
        run: pnpm run tsc

      - name: Install Backend Dependencies
        working-directory: development/backend
        run: pnpm install --frozen-lockfile

      - name: Generate Backend Prisma Client
        working-directory: development/backend
        run: npx prisma generate

      - name: Typecheck Backend
        working-directory: development/backend
        run: pnpm run tsc

  # ----------------------------------------------------------------------------
  # Job 2: Automated Testing (Vitest & Thanos Gate)
  # ----------------------------------------------------------------------------
  automated-tests:
    name: Test Suite Execution (592 Unit & Integration Tests)
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        working-directory: development/frontend
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Tests
        working-directory: development/frontend
        run: npx vitest run

      - name: Run Backend Tests
        working-directory: development/frontend
        run: npx vitest run --root ../backend

      - name: Execute Thanos Verification Gate
        run: bash scripts/verify-task.sh ALL

  # ----------------------------------------------------------------------------
  # Job 3: Security & Secret Hygiene Audit
  # ----------------------------------------------------------------------------
  security-audit:
    name: Cyber Security & Secret Hygiene Audit (Ultron)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Verify No Secrets in Git
        run: |
          echo "🔍 Auditing repository for tracked .env files..."
          if git ls-files | grep -E '(^|/)\.env($|\.local)'; then
            echo "❌ CRITICAL SECURITY ERROR: Unencrypted .env file found in Git index!"
            exit 1
          fi
          echo "✅ Secret hygiene audit passed: Zero .env files tracked in Git."

      - name: Audit Frontend Dependencies
        working-directory: development/frontend
        run: pnpm audit --prod --audit-level=high || true

      - name: Audit Backend Dependencies
        working-directory: development/backend
        run: pnpm audit --prod --audit-level=high || true

  # ----------------------------------------------------------------------------
  # Job 4: Container Build & Compose Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Multi-Stage Build & Compose Verification
    runs-on: ubuntu-latest
    needs: [code-quality, automated-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          cd infrastructure/docker
          docker compose --profile prod config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: development/backend
          file: infrastructure/docker/Dockerfile.backend
          push: false
          tags: owtlet-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: development/frontend
          file: infrastructure/docker/Dockerfile.frontend
          push: false
          tags: owtlet-web:ci-test

