# Owtlet — single Next.js app (UI + /api) + PostgreSQL (+ optional Redis, Nginx in production)
# Local dev:   docker compose up -d postgres          (then `pnpm dev` in development/frontend)
# Production:  docker compose --profile prod up -d --build   (finalised in TASK-019, Q-003)
services:
  postgres:
    image: postgres:16-alpine
    container_name: owtlet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owtlet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owtlet}
      POSTGRES_DB: ${POSTGRES_DB:-owtlet}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: owtlet_redis
    restart: unless-stopped
    profiles: ["redis"]

  web:
    build:
      context: ../../development/frontend
      dockerfile: ../../infrastructure/docker/Dockerfile.frontend
    container_name: owtlet_web
    restart: unless-stopped
    profiles: ["prod"]
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-owtlet}:${POSTGRES_PASSWORD:-owtlet}@postgres:5432/${POSTGRES_DB:-owtlet}?schema=public
    expose:
      - "3000"
    depends_on:
      - postgres

  nginx:
    image: nginx:1.27-alpine
    container_name: owtlet_nginx
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - web

volumes:
  pgdata:
