# ==============================================================================
# Owtlet™ Production Docker Compose (infrastructure/docker/docker-compose.yml)
# Unified Full-Stack Architecture: Next.js Storefront & REST API (port 3000)
# Reverse Proxy: Nginx 1.27 + Let's Encrypt SSL + owtlet.live 301 Redirect
# Local dev:   docker compose up -d postgres (or with --profile redis)
# Production:  docker compose --profile prod up -d --build
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: owtlet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owtlet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owtlet}
      POSTGRES_DB: ${POSTGRES_DB:-owtlet}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owtlet} -d ${POSTGRES_DB:-owtlet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: owtlet_redis
    restart: unless-stopped
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../../development/frontend
      dockerfile: ../../infrastructure/docker/Dockerfile.frontend
    container_name: owtlet_web
    restart: unless-stopped
    profiles: ["prod"]
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-owtlet}:${POSTGRES_PASSWORD:-owtlet}@postgres:5432/${POSTGRES_DB:-owtlet}?schema=public
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: owtlet_nginx
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    container_name: owtlet_certbot
    restart: unless-stopped
    profiles: ["prod"]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
    name: owtlet_pgdata
