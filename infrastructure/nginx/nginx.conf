# ==============================================================================
# Owtlet™ Production Nginx Reverse Proxy Configuration (infrastructure/nginx/nginx.conf)
# - owtlet.com (HTTPS)            -> Next.js Web (port 3000) & NestJS Backend (port 4000)
# - www.owtlet.com (HTTPS)        -> 301 https://owtlet.com$request_uri
# - owtlet.live & www.owtlet.live -> 301 https://owtlet.com$request_uri (REQ-F-019, AC-RDR-01)
# - HTTP (port 80)                -> 301 https://owtlet.com$request_uri (ACME challenge support)
# - Hardened CSP (terrific.live), HSTS, Rate Limits, and Security Headers
# ==============================================================================

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 10m;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Rate limiting zones (docs/10-security-plan.md)
    # General API: 10 requests/second with burst 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Sensitive Auth endpoints: 5 requests/minute with burst 5
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_status 429;

    # Upstream containers
    upstream web_upstream {
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:4000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP (Port 80) — ACME Challenge & Universal 301 HTTPS Redirect
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name owtlet.com www.owtlet.com owtlet.live www.owtlet.live;

        # Let's Encrypt ACME verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Universal permanent redirect to canonical apex HTTPS
        location / {
            return 301 https://owtlet.com$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. HTTPS (Port 443) — owtlet.live & www.owtlet.live -> owtlet.com 301
    # Satisfies AC-RDR-01 & REQ-F-019
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name owtlet.live www.owtlet.live;

        ssl_certificate     /etc/letsencrypt/live/owtlet.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/owtlet.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # 301 Permanent Redirect to apex owtlet.com
        return 301 https://owtlet.com$request_uri;
    }

    # --------------------------------------------------------------------------
    # 3. HTTPS (Port 443) — www.owtlet.com -> owtlet.com 301 Canonical Redirect
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.owtlet.com;

        ssl_certificate     /etc/letsencrypt/live/owtlet.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/owtlet.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://owtlet.com$request_uri;
    }

    # --------------------------------------------------------------------------
    # 4. HTTPS (Port 443) — owtlet.com Primary Application Reverse Proxy
    # Satisfies AC-DEP-01 & docs/10-security-plan.md
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name owtlet.com;

        # SSL Certificates & Modern Ciphers
        ssl_certificate     /etc/letsencrypt/live/owtlet.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/owtlet.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Strict Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Content Security Policy (allows Terrific Live SDK v2, Google Fonts, and self)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://terrific.live; connect-src 'self' https://terrific.live wss://terrific.live; frame-src 'self' https://terrific.live; media-src 'self' blob: https: https://terrific.live; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

        # ----------------------------------------------------------------------
        # Rate-Limited Sensitive Auth Endpoints (5 req/min per IP)
        # ----------------------------------------------------------------------
        location ~ ^/api/(admin/login|account/login|account/password-reset|age-verify) {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Backend REST API Routes (/api/*) (10 req/s with burst 20 per IP)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Next.js Static Cache Optimization
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ----------------------------------------------------------------------
        # Storefront Pages & Next.js SSR Web App
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
