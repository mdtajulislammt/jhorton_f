# Owtlet — Nginx reverse proxy (single Next.js app: UI + /api)
# - owtlet.com / www.owtlet.com  -> Next.js "web" container (port 3000)
# - owtlet.live / www.owtlet.live -> 301 https://owtlet.com (client Nov 9: "owtlet.live: redirects to owtlet.com", REQ-F-019)
# Certificates: Let's Encrypt (certbot) for all four names. Finalised in TASK-019 (DNS/VPS pending Q-003).

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 5m;
    server_tokens off;

    # Rate limiting zones (docs/10-security-plan.md)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    upstream web_upstream {
        server web:3000;
    }

    # ---- HTTP: ACME challenge + redirect everything to HTTPS ----------------
    server {
        listen 80;
        server_name owtlet.com www.owtlet.com owtlet.live www.owtlet.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # owtlet.com, www, owtlet.live and www.owtlet.live all land on https://owtlet.com
            return 301 https://owtlet.com$request_uri;
        }
    }

    # ---- owtlet.live (HTTPS) -> owtlet.com ----------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name owtlet.live www.owtlet.live;

        ssl_certificate     /etc/letsencrypt/live/owtlet.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/owtlet.com/privkey.pem;

        return 301 https://owtlet.com$request_uri;
    }

    # ---- www.owtlet.com -> owtlet.com ---------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name www.owtlet.com;

        ssl_certificate     /etc/letsencrypt/live/owtlet.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/owtlet.com/privkey.pem;

        return 301 https://owtlet.com$request_uri;
    }

    # ---- owtlet.com (app) ---------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name owtlet.com;

        ssl_certificate     /etc/letsencrypt/live/owtlet.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/owtlet.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Login / reset / age-gate endpoints: 5 req/min/IP
        location ~ ^/api/(admin/login|account/login|account/password-reset|age-verify) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route Handlers (same Next.js app)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pages
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
